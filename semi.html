<script>
(function () {
  var d = JSON.parse(document.getElementById('verrou-donnees').textContent);
  var b = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var CLE_SESSION = 'verrou-' + d.sel;

  function afficher(html) {
    document.open(); document.write(html); document.close();
    if (location.hash) setTimeout(function () {
      var el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (el) el.scrollIntoView();
    }, 0);
  }
  function dechiffrer(cleBrute) {
    return crypto.subtle.importKey('raw', cleBrute, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(d.iv) }, k, b(d.c)); })
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function deriver(code) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) {
        return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b(d.sel), iterations: d.it, hash: 'SHA-256' }, base, 256);
      });
  }

  // Code déjà tapé dans cet onglet : on ouvre directement.
  var memo = null;
  try { memo = sessionStorage.getItem(CLE_SESSION); } catch (e) {}
  if (memo) {
    document.documentElement.style.visibility = 'hidden';
    var montrer = function () { document.documentElement.style.visibility = ''; };
    var lancer = function () {
      dechiffrer(b(memo)).then(afficher, function () {
        try { sessionStorage.removeItem(CLE_SESSION); } catch (e) {}
        montrer();
      });
    };
    // Attendre la fin du chargement : document.open() pendant l'analyse de la page est ignoré.
    if (document.readyState === 'complete') lancer(); else addEventListener('load', lancer);
  }

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var ok = document.getElementById('ok'), msg = document.getElementById('msg');
    ok.disabled = true; msg.textContent = '';
    var brute;
    deriver(document.getElementById('code').value.trim())
      .then(function (bits) { brute = new Uint8Array(bits); return dechiffrer(brute); })
      .then(function (html) {
        try { sessionStorage.setItem(CLE_SESSION, btoa(String.fromCharCode.apply(null, brute))); } catch (e) {}
        afficher(html);
      }, function () {
        ok.disabled = false; msg.textContent = 'Code incorrect.';
        document.getElementById('code').select();
      });
  });
})();
</script>
</body>
</html>
